[package]
name = "mycelium"
version = "0.1.0"
edition = "2021"
description = "A distributed mesh network for POW++ proofs of work: exact Cl(4,1)(Q) geometric algebra, courts that adjudicate and settle, and client minds that learn and solve."
license = "Apache-2.0"
repository = "https://github.com/SAIOS-SAMN/mycelium"
readme = "README.md"
rust-version = "1.82"

[dependencies]
# Current kernel.rs dependency graph
# Core arithmetic — exact rational over Q
num-rational = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
# Serialization (socket responses only — not in hot data path)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
thiserror = "1.0"
# Cryptography
tiny-keccak = { version = "2.0", features = ["keccak"] }
blake3 = "1.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
# File locking
fs2 = "0.4"
tikv-jemallocator = { version = "0.6.1", features = ["stats"] }
# The allocator's own statistics, read on the stroke line (L33, §8.1):
# live bytes against resident, so retention is told from growth. The
# `stats` feature is what builds jemalloc with its counters on.
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
# `termination`: the handler also answers SIGTERM and SIGHUP. Without it
# only SIGINT persisted the ledger, and every `systemctl stop`/`restart`
# and every recut (SIGTERM) killed a court with its unpersisted state
# (2026-09-30: hypha b restored 1 ruled sentence of 17 ratified).
ctrlc = { version = "3.4", features = ["termination"] }
inotify = { version = "0.11", default-features = false }

[features]
# 78.137 — THE DRILL'S NEGATIVE CONTROL, never for a node: a court act is
# answered without its pre-reply sync, so `scripts/durable-drill` run on this
# build must lose acts — the proof that the green drill can fail.
drill-undurable = []

[dev-dependencies]
proptest = "1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
float_arithmetic    = "deny"
cast_precision_loss = "deny"
# STD1 3c-5: A WIDTH IS A PROVENANCE, NEVER A HOPE. A narrowing `as` stands
# only under an `#[expect]` naming where its bound comes from — the
# algebra's own range, the sensor's byte, a constant table — or the debt it
# is (AT1's slot, site 4's constant); anything else is exact or refused.
cast_possible_truncation = "deny"
# MU-STANDARDS 4.2: the tables of clippy.toml are read through these two.
disallowed_types    = "deny"
disallowed_methods  = "deny"
# The two lints that ask for `unwrap_or` / `unwrap_or_default` ask for a
# method clippy.toml disallows (a silent default where the match names the
# case): the law's match stands, and the lint that would undo it is off.
manual_unwrap_or         = "allow"
manual_unwrap_or_default = "allow"
# §2.4: COGNITION REFUSES, IT DOES NOT ABORT. A reader that cannot answer
# returns the refusal to the caller that can act on it; a process that dies
# answers nobody and loses the chain position it was holding.
# `allow-unwrap-in-tests` and its two siblings in clippy.toml scope these
# off `#[cfg(test)]`; an integration crate under `tests/` is a crate of its
# own that those cannot reach, so each opens with a root `#![allow]`.
unwrap_used         = "deny"
expect_used         = "deny"
panic               = "deny"
unreachable         = "deny"
todo                = "deny"
unimplemented       = "deny"
