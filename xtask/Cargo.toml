# AI-GENERATED CONTENT — see DISCLAIMER.md
[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
# The gate's unit tests live in `tests/` as modules of the binary
# (MU-STANDARDS 3.3); the crate has no integration tests.
autotests = false

[[bin]]
# The binary NAMES WHAT IT DOES: it runs the gate — the reading bound and
# clippy with warnings denied, both reported (I4). `lint-enumeration` named one rule it has not
# enforced since §4.2 made the pattern rules clippy configuration, and the
# line it printed at every commit said so.
name = "gate"
path = "main.rs"

[dependencies]
# MU-DERIVATIONS D1.4 — the numbers gate reads items with `syn`, never raw
# lines; `span-locations` gives each hit its line.
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tempfile = "3"
