# MU-STANDARDS 4.2 — the pattern rules of the laws, as lints. Each entry
# carries the rule it enforces; a path clippy cannot name is a review item
# under 4.4 and is never approximated by a text match.
#
# The entries arrive with their rule's commit: a rule is denied in the same
# commit that clears its sites (§4.2, and the ruling of 2026-09-12 on the
# per-lint split).

# Tests assert; the abort rules of 2.4 bind cognition, not a claim.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-types = [
    { path = "std::collections::HashMap", reason = "law 2, rule 9: a key is a canonical coordinate in a Keyed trie, never a hash bucket" },
    { path = "std::collections::BTreeMap", reason = "law 2, rule 9: a key is a canonical coordinate in a Keyed trie" },
    { path = "std::collections::HashSet", reason = "law 2, rule 9: presence is read from a Keyed set" },
    { path = "std::collections::BTreeSet", reason = "law 2, rule 9: presence is read from a Keyed set" },
    { path = "std::time::Instant", reason = "law 9: the clock is the receipt chain's k and the height, never wall time" },
    { path = "std::time::SystemTime", reason = "law 9: the clock is the receipt chain's k and the height" },
    { path = "std::time::Duration", reason = "law 9: an extent is measured in strokes and heights" },
]

disallowed-methods = [
    { path = "blake3::hash", reason = "law 2: identity is content written out, not a digest of it" },
    { path = "blake3::Hasher::new", reason = "law 2: identity is content written out, not a digest of it" },

    { path = "core::iter::Iterator::max", reason = "rule 4: nothing is chosen by a scalar; read the fiber" },
    { path = "core::iter::Iterator::min", reason = "rule 4: nothing is chosen by a scalar; read the fiber" },
    { path = "core::iter::Iterator::max_by", reason = "rule 4: nothing is chosen by a scalar" },
    { path = "core::iter::Iterator::min_by", reason = "rule 4: nothing is chosen by a scalar" },
    { path = "core::iter::Iterator::max_by_key", reason = "rule 4: nothing is chosen by a scalar" },
    { path = "core::iter::Iterator::min_by_key", reason = "rule 4: nothing is chosen by a scalar" },

    # §4.2's sort family. An ORDER IS A CHOICE at every position, not only
    # at the extremum: a sort by a canonical key is the key's own order and
    # stands with its reason; a sort by anything measured ranks lanes
    # against each other and is rule 4's, exactly as `min_by_key` is.
    { path = "slice::sort_by", reason = "rule 4: an order is a choice at every position; sort by a canonical key, never by a measurement" },
    { path = "slice::sort_by_key", reason = "rule 4: an order is a choice at every position" },
    { path = "slice::sort_unstable_by", reason = "rule 4: an order is a choice at every position" },
    { path = "slice::sort_unstable_by_key", reason = "rule 4: an order is a choice at every position" },

    { path = "core::option::Option::unwrap_or", reason = "rule 11: exact or refused; a missing value is a refusal, never a default" },
    { path = "core::option::Option::unwrap_or_else", reason = "rule 11: exact or refused" },
    { path = "core::option::Option::unwrap_or_default", reason = "rule 11: exact or refused" },
    { path = "core::result::Result::unwrap_or", reason = "rule 11: exact or refused" },
    { path = "core::result::Result::unwrap_or_else", reason = "rule 11: exact or refused" },
    { path = "core::result::Result::unwrap_or_default", reason = "rule 11: exact or refused" },
    { path = "u8::saturating_sub", reason = "rule 11: a floor at zero is an invented value; measure or refuse" },
    { path = "u16::saturating_sub", reason = "rule 11: a floor at zero is an invented value" },
    { path = "u32::saturating_sub", reason = "rule 11: a floor at zero is an invented value" },
    { path = "u64::saturating_sub", reason = "rule 11: a floor at zero is an invented value" },
    { path = "usize::saturating_sub", reason = "rule 11: a floor at zero is an invented value" },
    # Rule 15. A MEMBER BY POSITION IS A CHOICE. The question at each site
    # is whether the order is CONTENT or ARRIVAL: a canonical key order, a
    # wire tag's own offset, a slice pattern on the value just pushed, the
    # head of a FIFO drain, and a content extremum such as a bounding box
    # are the first four cases the order is content; anything else takes a
    # member because it arrived there, and that is a choice.
    { path = "slice::first", reason = "rule 15: a member by position is a choice; is the order content or arrival?" },
    { path = "slice::last", reason = "rule 15: a member by position is a choice" },
    { path = "core::iter::Iterator::nth", reason = "rule 15: a member by position is a choice" },

    { path = "u8::saturating_mul", reason = "rule 11: a ceiling is an invented value" },
    { path = "u16::saturating_mul", reason = "rule 11: a ceiling is an invented value" },
    { path = "u32::saturating_mul", reason = "rule 11: a ceiling is an invented value" },
    { path = "u64::saturating_mul", reason = "rule 11: a ceiling is an invented value" },
    { path = "usize::saturating_mul", reason = "rule 11: a ceiling is an invented value" },
]
